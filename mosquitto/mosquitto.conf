# /usr/share/doc/mosquitto/examples/mosquitto.conf.example

pid_file /home/piotr/work/solary/mosquitto/mosquitto.pid

persistence true
persistence_location /home/piotr/work/solary/mosquitto/

log_dest file /home/piotr/work/solary/mosquitto/mosquitto.log

#include_dir /etc/mosquitto/conf.d

allow_anonymous true
listener 1883 docstar
#listener 1883 docstar.fritz.box
listener 1883 localhost
