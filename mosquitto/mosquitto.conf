# Place your local configuration in /etc/mosquitto/conf.d/
#
# A full description of the configuration file is at
# /usr/share/doc/mosquitto/examples/mosquitto.conf.example

pid_file /home/piotr/work/solary/mosquitto/mosquitto.pid

persistence true
persistence_location /home/piotr/work/solary/mosquitto/

log_dest file /home/piotr/work/solary/mosquitto/mosquitto.log

#include_dir /etc/mosquitto/conf.d

allow_anonymous true
listener 1883 docstar
#listener 1883 docstar.fritz.box
listener 1883 localhost

connection bridge-khadas
address vim1s.fritz.box
topic # both 0
remote_clientid docstar
start_type automatic
try_private true
notifications false
#bridge_protocol_version mqttv311
#bridge_attempt_unsubscribe false
#bridge_insecure true

